name: README compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verified-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check README against the verified release
        run: python3 scripts/compatibility.py --check
